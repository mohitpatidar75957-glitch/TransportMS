spring.application.name=backend

# Database Configuration (Supports Local MySQL & Cloud Supabase / PostgreSQL / MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:tms-db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:mohit123}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# JPA / Hibernate Configuration
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.tenant_identifier_resolver=com.tms.backend.config.TenantIdentifierResolver

# Server Configuration
server.port=${PORT:8080}

# Twilio Configuration
twilio.account.sid=${TWILIO_ACCOUNT_SID:your_twilio_sid}
twilio.auth.token=${TWILIO_AUTH_TOKEN:your_twilio_auth_token}
twilio.phone.number=${TWILIO_PHONE_NUMBER:+17432157170}
