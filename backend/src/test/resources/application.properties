spring.application.name=backend-test
spring.datasource.url=jdbc:h2:mem:tms_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.tenant_identifier_resolver=com.tms.backend.config.TenantIdentifierResolver
server.port=0
